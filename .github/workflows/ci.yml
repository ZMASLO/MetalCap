name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The newest Xcode on the runner, so the app is built with the newest SDK.
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: |
          Scripts/make-app.sh
          ditto -c -k --keepParent build/MetalCap.app build/MetalCap.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: MetalCap-${{ github.sha }}
          path: build/MetalCap.zip
          retention-days: 14
