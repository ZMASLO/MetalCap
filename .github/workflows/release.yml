name: Release

# Pushing a tag such as v0.2.0 builds the app and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The newest Xcode on the runner, so the app is built with the newest SDK.
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" Scripts/make-app.sh
          ditto -c -k --keepParent build/MetalCap.app "build/MetalCap-${GITHUB_REF_NAME#v}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md.
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { inside = index($0, "## " version " ") == 1; next }
            inside' CHANGELOG.md > build/notes.md
          gh release create "$GITHUB_REF_NAME" "build/MetalCap-${GITHUB_REF_NAME#v}.zip" \
            --title "MetalCap ${GITHUB_REF_NAME#v}" --notes-file build/notes.md
